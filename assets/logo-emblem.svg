<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="GraniteFactory">
  <defs>
    <linearGradient id="gtop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#2f2f36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b667"/>
      <stop offset="1" stop-color="#b8801f"/>
    </linearGradient>
  </defs>
  <!-- isometric stone slab: top + two sides -->
  <polygon points="36,8 66,24 36,40 6,24" fill="url(#gtop)"/>
  <polygon points="6,24 36,40 36,58 6,42" fill="#26262a"/>
  <polygon points="66,24 36,40 36,58 66,42" fill="#1b1b1d"/>
  <!-- gold edge highlight along top-right -->
  <polygon points="66,24 36,40 36,43 66,27" fill="url(#gold)"/>
  <!-- sink cut-out on the top face -->
  <polygon points="30,20 44,20 50,23.5 36,31 22,23.5" fill="#15151a" opacity="0.9"/>
  <polygon points="30,21.5 42,21.5 46,24 36,29.5 26,24" fill="#0e0e12"/>
  <!-- faucet arc in gold -->
  <path d="M33 18 q0 -5 5 -5 t5 4" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
